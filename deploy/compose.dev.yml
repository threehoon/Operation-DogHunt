# 本机开发依赖：PostgreSQL + Milvus standalone（etcd 存元数据，MinIO 存段文件）。
# 前后端仍在宿主机运行（make backend / make frontend）。用法见 deploy/README.md。
#
# 在项目根目录执行，密码从 backend/.env 读取：
#   docker compose --env-file backend/.env -f deploy/compose.dev.yml up -d
#
# 必须写顶层 name。不写的话 Compose 用编排文件所在目录名当项目名，开发和交付两份文件都在 deploy/ 下，
# 会都叫 deploy：共用卷 deploy_pg_data、互相接管容器，对任意一份 down -v 会删掉两边的数据；
# 其他仓库里同样叫 deploy/ 的目录也会撞名。交付编排用 name: doghunt。
#
# 镜像核对（2026-11-16，本机 arm64 拉取通过）：
# - etcd 与 Milvus 来自 Milvus v2.5.4 官方 standalone 编排；Milvus 用 v2.5.4，pymilvus 跟 2.5.x。
# - MinIO：官方 v2.5.4 编排里的 minio/minio:RELEASE.2023-03-20T20-16-18Z 已无法拉取（Docker Hub 与
#   quay.io 的 minio/minio 仓库都拒绝访问），改用 Milvus v2.6.27 官方编排里的 milvusdb/minio 镜像；
#   该镜像带 curl，健康检查沿用官方写法。
# 端口只绑 127.0.0.1；MinIO 和 etcd 不发布到宿主机。

name: doghunt-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: doghunt
      POSTGRES_PASSWORD: ${DOGHUNT_DB_PASSWORD:?set DOGHUNT_DB_PASSWORD in backend/.env}
      POSTGRES_DB: doghunt
    ports:
      - "127.0.0.1:${DOGHUNT_DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doghunt -d doghunt"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      # 只用于本机开发；MinIO 不发布到宿主机，只有容器网络内的 Milvus 能访问。
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:${DOGHUNT_MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${DOGHUNT_MILVUS_HEALTH_PORT:-9091}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

volumes:
  pg_data:
  etcd_data:
  minio_data:
  milvus_data:
