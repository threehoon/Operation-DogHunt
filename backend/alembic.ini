# Alembic 迁移入口。连接串不写在这里：migrations/env.py 从 app.core.config.get_settings() 读取
# （backend/.env 里的 DOGHUNT_DB_*，或 DOGHUNT_DATABASE_URL 覆盖）。
# 用法（在 backend/ 下）：uv run --locked alembic upgrade head；或在项目根目录 make db-migrate。

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
